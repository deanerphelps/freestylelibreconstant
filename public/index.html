<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Libre 3 Live Glucose</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      background: #101018;
      color: #f8f8fb;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(980px, calc(100vw - 32px));
      background: #171722;
      border: 1px solid #303040;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
    }

    .title {
      font-weight: 700;
      color: #f8f8fb;
    }

    .pill {
      background: #2c2c3a;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      color: #fff;
    }

    .reading {
      display: flex;
      align-items: baseline;
      gap: 16px;
      min-height: 150px;
    }

    #glucose {
      font-size: clamp(96px, 16vw, 180px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -8px;
    }

    .unit {
      font-size: 30px;
      color: #f8f8fb;
    }

    #trend {
      margin-left: auto;
      font-size: 58px;
      font-weight: 700;
    }

    .meta {
      margin-top: 18px;
      color: #f8f8fb;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      font-size: 16px;
    }

    .warmupBox {
      margin-top: 22px;
    }

    #warmupBox button {
      background: #2c2c3a;
      color: #f8f8fb;
      border: 1px solid #3b3b50;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #warmupBox button:hover {
      background: #39394a;
    }

    #warmupPanel {
      margin-top: 14px;
      background: #11111a;
      border: 1px solid #303040;
      border-radius: 16px;
      padding: 14px;
    }

    .warmupTop {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      color: #ffd08a;
    }

    .progressOuter {
      width: 100%;
      height: 14px;
      background: #2a2a36;
      border-radius: 999px;
      overflow: hidden;
    }

    .progressInner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffb86b, #00d282);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .chartWrap {
      margin-top: 20px;
      height: 500px;
      box-sizing: border-box;
      overflow: visible;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .sideToggle {
      position: fixed;
      top: 140px;
      right: 18px;
      z-index: 50;
      background: #2c2c3a;
      color: #f8f8fb;
      border: 1px solid #3b3b50;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .calcSidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: min(420px, calc(100vw - 32px));
      height: 100vh;
      background: #11111a;
      border-left: 1px solid #303040;
      box-shadow: -20px 0 60px rgba(0,0,0,.45);
      z-index: 100;
      padding: 22px;
      box-sizing: border-box;
      transform: translateX(105%);
      transition: transform .25s ease;
    }

    .calcSidebar.open {
      transform: translateX(0);
    }

    .sideHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .sideHeader h3 {
      margin: 0;
    }

    #calcClose {
      background: #2c2c3a;
      color: #f8f8fb;
      border: 1px solid #3b3b50;
      border-radius: 999px;
      width: 36px;
      height: 36px;
      font-size: 22px;
      cursor: pointer;
    }

    .calcHeader {
      margin-bottom: 16px;
      color: #b9b9c8;
      font-size: 14px;
    }

    .calcLabel {
      display: block;
      color: #d7d7e2;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .calcLabel input {
      width: 100%;
      margin-top: 8px;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #3b3b50;
      background: #171722;
      color: #fff;
      font-size: 18px;
    }

    #calcDoseBtn {
      background: #2c2c3a;
      color: #f8f8fb;
      border: 1px solid #3b3b50;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    #calcDoseBtn:hover,
    .sideToggle:hover,
    #calcClose:hover {
      background: #39394a;
    }

    .calcResult {
      margin-top: 18px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.45;
    }

    .calcNote {
      margin-top: 12px;
      color: #ffcf8a;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="top">
      <div class="title">Libre 3 Live Glucose</div>
      <div class="pill" id="status">connecting</div>
    </div>

    <div class="reading">
      <div id="glucose">--</div>
      <div class="unit">mg/dL</div>
      <div id="trend">→</div>
    </div>

    <div class="meta">
      <span>Updated: <span id="updated">--</span></span>
      <span>Source: LibreLinkUp</span>
    </div>

    <div class="warmupBox" id="warmupBox">
      <button id="startWarmupBtn">Start sensor timer</button>

      <div id="warmupPanel" hidden>
        <div class="warmupTop">
          <strong id="warmupText">Sensor ready in -- min</strong>
          <button id="cancelWarmupBtn">Cancel</button>
        </div>

        <div class="progressOuter">
          <div class="progressInner" id="warmupProgress"></div>
        </div>
      </div>
    </div>

    <div class="chartWrap">
      <canvas id="chart"></canvas>
    </div>
  </main>

  <button id="calcToggle" class="sideToggle">Open Calculator</button>

  <aside id="calcSidebar" class="calcSidebar">
    <div class="sideHeader">
      <h3>Meal Calculator</h3>
      <button id="calcClose">×</button>
    </div>

    <div class="calcHeader">
      <span id="calcGlucose">Using latest: --</span>
    </div>

    <label class="calcLabel">
      Meal carbs
      <input id="carbInput" type="number" min="0" inputmode="decimal" placeholder="grams" />
    </label>

    <button id="calcDoseBtn">Calculate</button>

    <div id="calcResult" class="calcResult">
      Enter carbs to calculate.
    </div>
  </aside>

  <script>
    const DISPLAY_TIME_ZONE = 'America/New_York';

    const glucoseEl = document.getElementById('glucose');
    const trendEl = document.getElementById('trend');
    const updatedEl = document.getElementById('updated');
    const statusEl = document.getElementById('status');

    const startWarmupBtn = document.getElementById('startWarmupBtn');
    const cancelWarmupBtn = document.getElementById('cancelWarmupBtn');
    const warmupPanel = document.getElementById('warmupPanel');
    const warmupText = document.getElementById('warmupText');
    const warmupProgress = document.getElementById('warmupProgress');

    const calcToggle = document.getElementById('calcToggle');
    const calcSidebar = document.getElementById('calcSidebar');
    const calcClose = document.getElementById('calcClose');
    const carbInput = document.getElementById('carbInput');
    const calcDoseBtn = document.getElementById('calcDoseBtn');
    const calcResult = document.getElementById('calcResult');
    const calcGlucose = document.getElementById('calcGlucose');

    let latestGlucoseForCalc = null;
    let latestGlucoseTimestampForCalc = null;

    calcToggle.addEventListener('click', () => {
      calcSidebar.classList.add('open');
      setTimeout(() => carbInput.focus(), 100);
    });

    calcClose.addEventListener('click', () => {
      calcSidebar.classList.remove('open');
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        calcSidebar.classList.remove('open');
      }
    });

    const glucoseBandsPlugin = {
      id: 'glucoseBands',
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea) return;

        const y = scales.y;
        const top = chartArea.top;
        const bottom = chartArea.bottom;
        const y80 = y.getPixelForValue(80);
        const y175 = y.getPixelForValue(175);

        ctx.save();

        ctx.fillStyle = 'rgba(255, 55, 80, 0.10)';
        ctx.fillRect(chartArea.left, top, chartArea.right - chartArea.left, y175 - top);
        ctx.fillRect(chartArea.left, y80, chartArea.right - chartArea.left, bottom - y80);

        ctx.fillStyle = 'rgba(0, 210, 130, 0.12)';
        ctx.fillRect(chartArea.left, y175, chartArea.right - chartArea.left, y80 - y175);

        ctx.restore();
      }
    };

    const chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      plugins: [glucoseBandsPlugin],
      data: {
        labels: [],
        datasets: [{
          label: 'Glucose',
          data: [],
          tension: 0.35,
          borderWidth: 3,
          borderColor: '#f8f8fb',
          backgroundColor: 'rgba(255,255,255,.06)',
          fill: false,
          pointRadius: 4,
          pointHoverRadius: 7,
          pointBackgroundColor: '#f8f8fb',
          pointBorderColor: '#f8f8fb',
          pointBorderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        clip: false,
        layout: {
          padding: {
            top: 28,
            right: 18,
            bottom: 34,
            left: 12
          }
        },
        plugins: {
          legend: { display: false }
        },
        scales: {
          x: {
            ticks: {
              color: '#9a9aab',
              maxTicksLimit: 8,
              autoSkip: true,
              maxRotation: 0,
              minRotation: 0,
              padding: 12
            },
            grid: {
              color: 'rgba(255,255,255,.06)'
            }
          },
          y: {
            min: 50,
            max: 350,
            ticks: {
              color: '#9a9aab',
              stepSize: 50,
              padding: 8
            },
            grid: {
              color: 'rgba(255,255,255,.08)'
            }
          }
        }
      }
    });

    function applyReading(reading) {
      const value = reading.glucose ?? reading.value;

      if (value === null || value === undefined) {
        glucoseEl.textContent = '--';
        trendEl.textContent = reading.trend || '⏳';
        statusEl.textContent = reading.message || 'waiting';
        return;
      }

      const ts = reading.timestamp
        ? new Date(new Date(reading.timestamp).getTime() + (4 * 60 * 60 * 1000))
        : new Date();

      glucoseEl.textContent = value;
      updateCalcLatest(reading);
      trendEl.textContent = reading.trend || '→';

      updatedEl.textContent = ts.toLocaleString('en-US', {
        timeZone: DISPLAY_TIME_ZONE,
        month: 'numeric',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
      });

      statusEl.textContent = 'live';

      const label = ts.toLocaleTimeString('en-US', {
        timeZone: DISPLAY_TIME_ZONE,
        hour: 'numeric',
        minute: '2-digit'
      });

      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(value);

      if (chart.data.labels.length > 120) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }

      chart.update();
    }

    async function loadInitial() {
      try {
        const historyRes = await fetch('/api/history');

        if (historyRes.ok) {
          const history = await historyRes.json();
          history.slice(-120).forEach(applyReading);
        }

        const latestRes = await fetch('/api/latest');

        if (latestRes.ok) {
          applyReading(await latestRes.json());
        }
      } catch {
        statusEl.textContent = 'offline';
      }
    }

    function connectWs() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onopen = () => {
        statusEl.textContent = 'live';
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === 'glucose') {
          applyReading(msg.data);
        }

        if (msg.type === 'error') {
          statusEl.textContent = 'error';
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'reconnecting';
        setTimeout(connectWs, 5000);
      };
    }

    let warmupTimer = null;

    function startWarmup(minutes) {
      const totalMs = minutes * 60 * 1000;
      const startedAt = Date.now();
      const endsAt = startedAt + totalMs;

      localStorage.setItem('sensorWarmup', JSON.stringify({
        startedAt,
        endsAt,
        totalMs
      }));

      renderWarmup();
    }

    function stopWarmup() {
      localStorage.removeItem('sensorWarmup');
      warmupPanel.hidden = true;
      startWarmupBtn.hidden = false;

      if (warmupTimer) {
        clearInterval(warmupTimer);
        warmupTimer = null;
      }
    }

    function renderWarmup() {
      const saved = localStorage.getItem('sensorWarmup');

      if (!saved) {
        warmupPanel.hidden = true;
        startWarmupBtn.hidden = false;
        return;
      }

      const { startedAt, endsAt, totalMs } = JSON.parse(saved);
      const now = Date.now();
      const remainingMs = Math.max(0, endsAt - now);
      const elapsedMs = Math.max(0, now - startedAt);
      const percent = Math.min(100, Math.round((elapsedMs / totalMs) * 100));
      const remainingMinutes = Math.ceil(remainingMs / 60000);

      warmupPanel.hidden = false;
      startWarmupBtn.hidden = true;

      if (remainingMs <= 0) {
        warmupText.textContent = 'Sensor should be ready now';
        warmupProgress.style.width = '100%';
        return;
      }

      warmupText.textContent = `Sensor ready in ${remainingMinutes} min`;
      warmupProgress.style.width = `${percent}%`;
    }

    startWarmupBtn.addEventListener('click', () => {
      const input = prompt('How many minutes until the sensor is ready?', '60');
      if (!input) return;

      const minutes = Number(input);

      if (!Number.isFinite(minutes) || minutes <= 0) {
        alert('Please enter a valid number of minutes.');
        return;
      }

      startWarmup(minutes);
    });

    cancelWarmupBtn.addEventListener('click', stopWarmup);

    function correctionUnits(glucose) {
      if (glucose >= 300) return 5;
      if (glucose >= 260) return 4;
      if (glucose >= 220) return 3;
      if (glucose >= 180) return 2;
      return 0;
    }

    function roundToHalf(value) {
      return Math.round(value * 2) / 2;
    }

    function updateCalcLatest(reading) {
      const value = reading?.glucose ?? reading?.value;

      if (value === null || value === undefined) return;

      latestGlucoseForCalc = Number(value);
      latestGlucoseTimestampForCalc = reading.timestamp ? new Date(reading.timestamp) : new Date();

      calcGlucose.textContent = `Using latest: ${latestGlucoseForCalc} mg/dL`;
    }

    function calculateMealDose() {
      const carbs = Number(carbInput.value);

      if (!Number.isFinite(carbs) || carbs < 0) {
        calcResult.textContent = 'Enter valid meal carbs.';
        return;
      }

      if (!Number.isFinite(latestGlucoseForCalc)) {
        calcResult.textContent = 'No latest glucose available yet.';
        return;
      }

      const carbDose = carbs / 12.5;
      const correctionDose = correctionUnits(latestGlucoseForCalc);
      const totalDose = roundToHalf(carbDose + correctionDose);

      calcResult.innerHTML = `
        <div>${totalDose}u total</div>
        <div>${roundToHalf(carbDose)}u carbs + ${correctionDose}u correction</div>
        <div style="color:#b9b9c8;font-size:14px;margin-top:6px;">
          Based on ${carbs}g carbs and ${latestGlucoseForCalc} mg/dL.
        </div>
      `;
    }

    calcDoseBtn.addEventListener('click', calculateMealDose);

    carbInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') calculateMealDose();
    });

    loadInitial();
    connectWs();
    renderWarmup();
    warmupTimer = setInterval(renderWarmup, 1000);
  </script>
</body>
</html>
