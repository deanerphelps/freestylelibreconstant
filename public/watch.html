<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background:black;color:white;text-align:center;font-size:40px; }
</style>
</head>
<body>
<div id="g">--</div>
<div id="t">→</div>
<div id="status" style="font-size:16px"></div>
<script>
let lastKnown = null;
function showReading(message = '') {
  const age = lastKnown ? Date.now() - Date.parse(lastKnown.sourceTimestamp || lastKnown.timestamp) : Infinity;
  const stale = !Number.isFinite(age) || age > 600000;
  document.getElementById('g').textContent = lastKnown?.glucose ?? '--';
  document.getElementById('t').textContent = stale ? '⏳' : lastKnown.trend;
  document.getElementById('status').textContent = lastKnown && stale
    ? `Last known • ${Math.floor(age / 60000)} min old. ${message}` : message;
}
async function update() {
  try {
    const res = await fetch('/api/latest', { cache: 'no-store' });
    const d = await res.json();
    lastKnown = res.ok ? d : (d.lastKnown || lastKnown);
    showReading(res.ok ? 'live' : (d.message || 'waiting for Libre update'));
  } catch {
    showReading('reconnecting');
  }
}
setInterval(update,15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) update(); });
update();
</script>
</body>
</html>
